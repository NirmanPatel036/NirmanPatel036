<svg xmlns="http://www.w3.org/2000/svg" width="269" height="236" viewBox="0 0 269 236" role="img" aria-label="Research: Explainable AI. Multimodal models that grade Non-Alcoholic Fatty Liver Disease severity from liver ultrasound and clinical data."><title>Research: Explainable AI. Multimodal models that grade Non-Alcoholic Fatty Liver Disease severity from liver ultrasound and clinical data.</title><style>@font-face{font-family:'NPMono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'NPSerif';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'NPSerif';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'NPSans';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes breathe{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.ray{transform-box:fill-box;transform-origin:0% 50%;animation:grow 1.4s cubic-bezier(.2,.7,.2,1) both,breathe 5s ease-in-out infinite}
.dot{transform-box:fill-box;transform-origin:50% 50%;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.layer{animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
.bob{animation:bob 6s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:spin 40s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
