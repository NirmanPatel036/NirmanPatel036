<svg xmlns="http://www.w3.org/2000/svg" width="840" height="60" viewBox="0 0 840 60" role="img" aria-label="What I built"><title>What I built</title><style>@font-face{font-family:'NPSerif';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'NPSerif';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes breathe{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.ray{transform-box:fill-box;transform-origin:0% 50%;animation:grow 1.4s cubic-bezier(.2,.7,.2,1) both,breathe 5s ease-in-out infinite}
.dot{transform-box:fill-box;transform-origin:50% 50%;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.layer{animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
.bob{animation:bob 6s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:spin 40s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><text x="0.0" y="46.0" font-size="46" xml:space="preserve"><tspan font-family="NPSerif" fill="#3B2A36">What I </tspan><tspan font-family="NPSerif" font-style="italic" fill="#4B4BF0">built</tspan></text><circle cx="207.422" cy="41.5" r="4.5" fill="#4B4BF0"/><circle cx="222.422" cy="41.5" r="4.5" fill="#F0643F"/><circle cx="237.422" cy="41.5" r="4.5" fill="#E8920F"/></svg>